[project]
name = "laya-vs-jev"
version = "0.1.0"
description = "Laya (local, open-weight) vs JEV (hosted) decision models: CPU/GPU speed, zero-shot accuracy, and fine-tuning Laya on support tickets"
readme = "README.md"
authors = [
    { name = "Jinho", email = "jinhokim.kor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "laya>=0.3.27",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false
